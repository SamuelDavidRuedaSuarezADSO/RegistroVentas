<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="estilos/home-venta.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <title>Venta Muebles HomeHouse - Home</title>
</head>

<body>
  <header>
    <div class="home">
      <button class="home__bars" onclick="toggleMenu()">
        <i class="fa-solid fa-bars home__icon"></i>
      </button>
      <div id="sidebar" class="sidebar">
        <div>
          <a href="javascript:void(0)" class="closebtn" onclick="toggleMenu()">
            <button class="home__bars icon">
              <i class="fa-solid fa-bars home__icon "></i>
            </button>
          </a>
          <a href="#" class="venta">Venta</a>
          <a href="muebles.html">Muebles</a>
          <a href="categoria.html">Categoria</a>
          <a href="#">Pedidos</a>
          <a href="clientes.html">Clientes</a>
          <a href="usuarios.html">Usuarios</a>
        </div>
        <div class="sidebar__last">
          <a href="resgistro.html">Registrar Usuario</a>
          <a href="../index.html">Cerrar Seción</a>
        </div>
      </div>
      <img src="../assets/Imagenes/Logo.svg" alt="logo" class="home__logo">
      <h1 class="home__title">VENTA</h1>
    </div>
  </header>
  <main>
    <section class="datos">
      <form action="" class="datos__form" id="form" novalidate>
        <div class="form__user">
          <div class="form__users">
            <label for="empleNom" class="user__label">NOMBRE DEL EMPLEADO:</label>
            <select type="text" id="empleNom" name="empleNom" class="user__input">
              <option value=" " selected>Seleccione un empleado...</option>
            </select>
            <label for="empleCod" class="user__label">CODIGO DEL EMPLEADO:</label>
            <input type="text" id="empleCod" name="empleCod" class="user__input" disabled required>
            <label for="clienNom" class="user__label">NOMBRE DEL CLIENTE:</label>
            <select type="text" id="clienNom" name="clienNom" class="user__input">
              <option value=" " selected>Seleccione un Cliente...</option>
            </select>
            <label for="clienCod" class="user__label">CODIGO DEL CLIENTE:</label>
            <input type="text" id="clienCod" name="clienCod" class="user__input" disabled required>
          </div>
        </div>
        <div class="form__user">
          <div class="form__users part1">
            <label for="Cod" class="user__label" style="display: none;">CODIGO DEL MUEBLE:</label>
            <input type="text" id="Cod" name="Cod" class="user__input" style="display: none;" disabled required>
            <label for="Nom" class="user__label">NOMBRE DEL MUEBLE:</label>
            <input type="text" id="Nom" name="Nom" class="user__input" disabled required>
            <label for="Color" class="user__label">COLOR:</label>
            <input type="text" id="Color" name="Color" class="user__input" disabled required>
            <label for="Categ" class="user__label">CATEGORIA:</label>
            <input type="text" id="Categ" name="Categ" class="user__input" disabled required>
            <label for="Pre" class="user__label">PRECIO:</label>  
            <input type="text" id="Pre" name="Pre" class="user__input" disabled required>
            <label for="Stock" class="user__label">STOCK:</label>
            <input type="text" id="Stock" name="Stock" class="user__input" disabled required>
            <label for="Cant" class="user__label">CANTIDAD:</label>
            <input type="number" id="Cant" name="Cant" class="user__input" value="0">
          </div>
          <button class="botones__boton boton--pagar add" type="submit"><b>AÑADIR</b></button>
        </div>
      </form>
    </section>
    <section class="search">
      <div class="search__search">
        <button class="search__lupa">
          <i class="fa-solid fa-magnifying-glass search__lupa--icon"></i>
        </button>
        <form action="" class="search__form" id="search" novalidate>
          <input type="search" name="input" id="input" class="form__input" autocomplete="off" required>
          <button class="search__add" id="buscar" type="submit">Buscar</button>
        </form>
      </div>
      
    </section>
    <section class="table">
      <table class="table__table">
        <thead>
          <tr>
            <th>CODIGO</th>
            <th>NOMBRE</th>
            <th>COLOR</th>
            <th>CANTIDAD</th>
            <th>VALOR/U</th>
            <th>VALOR/T</th>
            <th>ELIMINAR</th>
          </tr>
        </thead>
        <tbody class="table__table table__table--body" id="tbody">          
        </tbody>
      </table>
      <table class="table__fin">
        <thead>
          <tr>
            <th class="table__p">TOTAL A PAGAR:</th>
          </tr>
        </thead>
        <tbody class="table__body">
          <tr class="table__body">
            <td class="table__body table--press" id="totalF"></td>
          </tr>
        </tbody>
      </table>
    </section>
    <section class="botones">
      <button class="botones__boton boton--eliminar">ELIMINAR</button>
      <button class="botones__boton boton--pagar" id="open">PAGAR</button>
    </section>
    <section id="detall" class="modal">
      <div class="modal__content">
        <h2>ULTIMOS DETALLES</h2>
        <table class="table__table table2">
          <thead>
            <tr>
              <th>CODIGO</th>
              <th>NOMBRE</th>
              <th>CANTIDAD</th>
              <th>VALOR/U</th>
              <th>VALOR/T</th>
            </tr>
          </thead>
          <tbody class="table__table table__table--body">

          </tbody>
        </table>


        <form action="" class="mobal__detalles" id="fomrDetalls">
          <div class="form__data">
            <label for="emple" class="user__label">Empleado:</label>
            <input type="text" id="emple" name="emple" class="user__input" required disabled>
            <label for="client" class="user__label">Cliente:</label>
            <input type="text" id="client" name="client"  class="user__input" required disabled>
            <label for="totPaga" class="user__label">Total a Pagar:</label>
            <input type="text" id="totPaga" name="totPaga" class="user__input" required disabled>
            <label for="pagaCon" class="user__label">Paga con:</label>
            <input type="text" id="pagaCon" name="pagaCon" class="user__input" required>
          </div>
          <div class="mobal__botones">
            <button class="botones__boton boton--pagar" type="submit">CONFIRMAR</button>
            <button id="close" class="botones__boton boton--eliminar Cerrar">CANCELAR</button>
          </div>
        </form>
        
      </div>
    </section>
    <footer class="info">
      <h3 class="info__copy">©2024 SamuelRueda. Todos los derechos reservador</h3>
      <div class="info__fecha" id="fecha"></div>
    </footer>
  </main>
  <script src="scripts/main.js"></script>
  <script src="scripts/home.js" type="module"></script>
</body>

</html>
